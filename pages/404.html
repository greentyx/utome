<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — UTOME</title>
  <link rel="icon" type="image/png" href="../assets/favicon/logotipo.png" />

  <link rel="stylesheet" href="../styles/variables.css" />
  <link rel="stylesheet" href="../styles/global.css" />
  <style>
    body { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; text-align: center; background: var(--color-cream); }

    .err__title { font-size: var(--text-2xl); font-weight: 500; margin: var(--space-4) 0 var(--space-3); }

</head>
<body>
  <div class="err__code">404</div>
  <h1 class="err__title">Página não encontrada.</h1>
  <p class="err__sub">Esse conteúdo não existe ou foi movido.</p>
