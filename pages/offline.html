<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline — UTOME</title>
  <link rel="icon" type="image/png" href="../assets/favicon/logotipo.png" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../styles/variables.css" />
  <link rel="stylesheet" href="../styles/global.css" />
  <style>
    body { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; text-align: center; background: var(--color-cream); }
    .offline__icon { width: 64px; height: 64px; border-radius: 50%; background: var(--color-orange-bg); display: flex; align-items: center; justify-content: center; margin: 0 auto var(--space-5); }
    .offline__title { font-size: var(--text-2xl); font-weight: 500; margin-bottom: var(--space-3); }
    .offline__sub { font-size: var(--text-base); color: var(--color-gray-2); margin-bottom: var(--space-7); }
  </style>
</head>
<body>
  <div class="offline__icon">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#ff4f18" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <line x1="1" y1="1" x2="23" y2="23"/>
      <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/>
      <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/>
      <path d="M10.71 5.05A16 16 0 0 1 22.56 9"/>
      <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/>
      <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
      <line x1="12" y1="20" x2="12.01" y2="20"/>
    </svg>
  </div>
  <h1 class="offline__title">Você está offline.</h1>
  <p class="offline__sub">Verifique sua conexão e tente novamente.</p>
  <a href="../index.html" class="btn btn--outline">Tentar novamente</a>
</body>
</html>
